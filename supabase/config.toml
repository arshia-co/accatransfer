project_id = "acca-smart-apply"

[functions.smart-apply-chat]
# Guest chat is origin-restricted in the function body.
verify_jwt = false

[functions.smart-apply-voice]
# Guest voice sessions are origin-restricted in the function body.
verify_jwt = false

[functions.transfer-analyze]
# Explicit bearer validation is performed with supabase.auth.getUser().
verify_jwt = false

[functions.document-ocr]
# Explicit bearer validation is performed with supabase.auth.getUser(); service
# role calls are accepted only for internal admin-triggered OCR.
verify_jwt = false

[functions.guest-transcript-ocr]
# Public pre-login transcript preview. Origin and Turnstile checks are enforced
# inside the function before any AI/OCR provider call.
verify_jwt = false

[functions.submit-application]
# The platform validates the user JWT; the function also resolves the user
# before reading private profile and document rows.
verify_jwt = true

[functions.account-event-email]
# The platform validates the user JWT; the function sends only to the current
# authenticated user's email address.
verify_jwt = true

[functions.account-admin-alert]
# Signup can complete before Supabase returns a user session, so this function
# does its own JWT/Turnstile/user-id verification before notifying admins.
verify_jwt = false

[functions.security-verify]
# Logged-in upload flows call this before storage writes. Guest routes use their
# own public function validation, so this helper can require the user JWT.
verify_jwt = true
