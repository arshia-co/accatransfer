    <!-- Structured data: organisation + site + the web app itself -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://accatransfer.com/#organization",
          "name": "ACCA EDU",
          "url": "https://accatransfer.com",
          "logo": "https://accatransfer.com/assets/acca-logo-320.webp",
          "sameAs": ["https://www.accaco.com", "https://www.instagram.com/acca_edu/"]
        },
        {
          "@type": "WebSite",
          "@id": "https://accatransfer.com/#website",
          "url": "https://accatransfer.com",
          "name": "ACCA Smart Apply",
          "inLanguage": ["fa", "en"],
          "publisher": { "@id": "https://accatransfer.com/#organization" }
        },
        {
          "@type": "WebApplication",
          "name": "ACCA Smart Apply",
          "url": "https://accatransfer.com",
          "applicationCategory": "EducationApplication",
          "operatingSystem": "Web",
          "inLanguage": ["fa", "en"],
          "description": "AI-guided admission and university-transfer assistant for studying in Turkey: major discovery, university matching and transcript analysis.",
          "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
          "publisher": { "@id": "https://accatransfer.com/#organization" }
        }
      ]
    }
    </script>
    <script>
      (function restoreSpaPath(location) {
        if (location.search.slice(0, 2) !== '?/') return;
        var restoredPath = location.search
          .slice(1)
          .split('&')
          .map(function decodePart(part) {
            return part.replace(/~and~/g, '&');
          })
          .join('?');
        window.history.replaceState(null, '', restoredPath + location.hash);
      })(window.location);
    </script>
