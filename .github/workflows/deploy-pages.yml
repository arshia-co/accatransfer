name: Deploy ACCA Transfer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        env:
          VITE_SUPABASE_URL: https://qysluhfrjpcguhneqsuz.supabase.co
          VITE_SUPABASE_ANON_KEY: sb_publishable_uhclsIDMqnKxbUzkbgcYsg_a70CzU29
          # Cloudflare Turnstile public keys for the ACCA Smart Apply / AI Transfer OCR gate.
          VITE_TURNSTILE_SITE_KEY: 0x4AAAAAADnyH7hcmmXxhRgD
          VITE_TURNSTILE_VERIFY_URL: https://turnstile-siteverify-acca-smart-apply.accatransfer.workers.dev/siteverify
        run: npm run build

      - name: Add direct SPA route entries
        run: |
          for route in smart-apply ai-transfer account smart-apply/account ai-transfer/account; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        uses: actions/deploy-pages@v4
        id: deployment
